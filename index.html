<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LazyFly.me</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<link rel="manifest" href="appmanifest.json">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
	<link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
	<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
	<link rel="icon" type="image/png" href="icons/icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fb-root"></div>
	<script src="box2d.asm.js"></script>
	<script src="opus.js"></script>
	<script src="c2runtime.js"></script>
	<script src="start.js"></script>
	<script src="register-sw.js"></script>

<!--
  Attempt counter — positioned directly below the in-game level number text.

  The level number ("Level 1", "Level 2" etc.) is rendered by the Level1Text
  object type (type uid 35, plugin type 9 = Text). Every layout places one
  instance of it at a world-space position with: font Arial 12px, color black.
  (Confirmed from data.js instance data.)

  We read the instance's world x/y, convert to screen coords using the
  layout's scrollX/scrollY and the canvas scale, then place this div
  immediately below it — same font, same size, same color.

  rt.g_h$.scrollX / scrollY = camera center in world coords  (confirmed c2runtime.js)
  rt.g_iS / rt.g_iT         = logical canvas width / height  (confirmed c2runtime.js)
  rt.g_h$.scale              = layout zoom                    (confirmed c2runtime.js)
-->
<div id="lf-attempt" style="
  position: fixed;
  z-index: 9999;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: normal;
  color: rgb(0,0,0);
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  text-align: left;
  display: none;
">Attempt 1</div>

<script>
(function () {
  var el         = document.getElementById('lf-attempt');
  var attempts   = 1;
  var lastDeaths = 0;
  var lastLayout = null;
  var dfVar      = null;

  function render() {
    el.textContent = 'Attempt ' + attempts;
  }

  // Convert a world-space point to fixed screen coords using the runtime's
  // camera scroll and the canvas physical position.
  function worldToScreen(rt, worldX, worldY) {
    var c = window.c3canvas;
    if (!c) return null;
    var r = c.getBoundingClientRect();
    if (r.width < 10 || r.height < 10) return null;

    var layout  = rt.g_h$;
    var scrollX = layout.scrollX || 0;
    var scrollY = layout.scrollY || 0;
    var scale   = layout.scale   || 1;
    var logW    = rt.g_iS; // logical canvas width  (e.g. 854)
    var logH    = rt.g_iT; // logical canvas height (e.g. 480)

    // World → logical canvas coords (camera center = canvas center)
    var lx = (worldX - scrollX) * scale + logW / 2;
    var ly = (worldY - scrollY) * scale + logH / 2;

    // Logical → physical screen coords
    return {
      x: r.left + lx * (r.width  / logW),
      y: r.top  + ly * (r.height / logH)
    };
  }

  function pin(rt) {
    // Find whichever LevelNText type has a live instance on this layout.
    // Levels 1–26 each place one instance of their own type (Level1Text … Level26Text).
    var type = null;
    for (var n = 1; n <= 26; n++) {
      var t = rt.types && rt.types['Level' + n + 'Text'];
      if (t && t.g_jQ && t.g_jQ.length) { type = t; break; }
    }
    if (!type) return false;

    var inst = type.g_jQ[0];

    // Left edge and top of the level text in world space
    // (inst.x, inst.y are the centre; width≈60, height≈20 from data.js)
    var leftX = inst.x - (inst.width  || 60) / 2;
    var topY  = inst.y - (inst.height || 20) / 2;

    var leftEdge = worldToScreen(rt, leftX, topY);
    if (!leftEdge) return false;

    // Scale the 20px world-height to screen pixels for the vertical gap
    var c      = window.c3canvas;
    var r      = c.getBoundingClientRect();
    var scale  = (rt.g_h$.scale || 1);
    var pxPerWorldUnit = (r.height / rt.g_iT) * scale;
    var textScreenH    = 20 * pxPerWorldUnit;

    // Left-align the div to the level text's left edge
    el.style.right   = 'auto';
    el.style.left    = leftEdge.x + 'px';
    el.style.top     = (leftEdge.y + textScreenH + 2) + 'px';
    el.style.display = 'block';

    // Match the font size to the level text's 12px world size → screen px
    var fontSize = Math.round(12 * pxPerWorldUnit);
    el.style.fontSize = Math.max(8, fontSize) + 'px';

    return true;
  }

  function getDeadFlies(rt) {
    if (dfVar) return dfVar;
    var keys = Object.keys(rt.g_hZ);
    for (var i = 0; i < keys.length; i++) {
      if (rt.g_hZ[keys[i]].name === 'DeadFlies') {
        dfVar = rt.g_hZ[keys[i]];
        break;
      }
    }
    return dfVar;
  }

  render();

  setInterval(function () {
    var rt = window.c3runtime;
    if (!rt || !rt.g_hZ || !rt.g_h$ || !rt.g_iS) return;

    // Reset on layout change
    var layout = rt.g_h$.g_jC;
    if (layout !== lastLayout) {
      lastLayout = layout;
      attempts   = 1;
      lastDeaths = 0;
      dfVar      = null;
      render();
    }

    // Position below the level number
    if (!pin(rt)) {
      el.style.display = 'none';
      return;
    }

    // Increment on deaths
    var v = getDeadFlies(rt);
    if (!v || typeof v.data !== 'number') return;
    if (v.data > lastDeaths) {
      attempts  += v.data - lastDeaths;
      lastDeaths = v.data;
      render();
    }
  }, 250);
})();
</script>
</body>
</html>
