<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LazyFly.me</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<link rel="manifest" href="appmanifest.json">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
	<link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
	<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
	<link rel="icon" type="image/png" href="icons/icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fb-root"></div>
	<script src="box2d.asm.js"></script>
	<script src="opus.js"></script>
	<script src="c2runtime.js"></script>
	<script src="start.js"></script>
	<script src="register-sw.js"></script>

<!-- Death Counter Overlay -->
<div id="lazyfly-deaths" style="
  position: fixed;
  top: 12px;
  right: 14px;
  z-index: 9999;
  font-family: monospace;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  background: rgba(30,30,30,0.72);
  padding: 3px 10px 3px 8px;
  border-radius: 4px;
  pointer-events: none;
  user-select: none;
  letter-spacing: 0.04em;
">&#128128; 0</div>

<script>
(function () {
  var KEY = 'lazyfly_total_deaths';
  var totalDeaths = parseInt(localStorage.getItem(KEY) || '0', 10);
  var lastSessionCount = 0;
  var el = document.getElementById('lazyfly-deaths');

  function render() {
    el.textContent = '\uD83D\uDC80 ' + totalDeaths;
  }
  render();

  // Cached reference to the DeadFlies variable object in the C3 runtime
  var deadFliesVar = null;

  function getSessionDeaths() {
    var rt = window.c3runtime;
    if (!rt || !rt.g_hZ) return null;

    // Find the DeadFlies global variable by name (cached after first discovery)
    if (!deadFliesVar) {
      var keys = Object.keys(rt.g_hZ);
      for (var i = 0; i < keys.length; i++) {
        var v = rt.g_hZ[keys[i]];
        if (v && v.name === 'DeadFlies') {
          deadFliesVar = v;
          break;
        }
      }
    }

    if (!deadFliesVar || typeof deadFliesVar.data !== 'number') return null;
    return deadFliesVar.data;
  }

  function poll() {
    var current = getSessionDeaths();
    if (current === null) return; // runtime not ready yet

    if (current > lastSessionCount) {
      totalDeaths += (current - lastSessionCount);
      localStorage.setItem(KEY, totalDeaths);
      render();
    }
    lastSessionCount = current;
  }

  setInterval(poll, 250);
})();
</script>
</body>
</html>
