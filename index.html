<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>LazyFly.me</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	<link rel="manifest" href="appmanifest.json">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
	<link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
	<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
	<link rel="icon" type="image/png" href="icons/icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="fb-root"></div>
	<script src="box2d.asm.js"></script>
	<script src="opus.js"></script>
	<script src="c2runtime.js"></script>
	<script src="start.js"></script>
	<script src="register-sw.js"></script>

<!-- Attempt Counter (Geometry Dash style) -->
<div id="lazyfly-attempt" style="
  position: fixed;
  bottom: 18%;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  font-family: Arial Black, Arial, sans-serif;
  font-size: clamp(28px, 6vw, 64px);
  font-weight: 900;
  color: rgba(255,255,255,0.13);
  pointer-events: none;
  user-select: none;
  white-space: nowrap;
  letter-spacing: 0.02em;
  text-transform: uppercase;
"></div>

<script>
(function () {
  var attempts = 1;
  var lastDeaths = 0;
  var lastLayout = null;
  var deadFliesVar = null;
  var el = document.getElementById('lazyfly-attempt');

  // Gameplay layouts only — title/tutorial/end don't show the counter
  var SKIP_LAYOUTS = null; // populated on first run

  function render() {
    el.textContent = 'Attempt ' + attempts;
  }

  function findDeadFliesVar(rt) {
    if (deadFliesVar) return deadFliesVar;
    var keys = Object.keys(rt.g_hZ);
    for (var i = 0; i < keys.length; i++) {
      var v = rt.g_hZ[keys[i]];
      if (v && v.name === 'DeadFlies') { deadFliesVar = v; break; }
    }
    return deadFliesVar;
  }

  function poll() {
    var rt = window.c3runtime;
    if (!rt || !rt.g_hZ || !rt.g_h$) return;

    var currentLayout = rt.g_h$.g_jC;

    // Layout changed → reset attempts for the new level
    if (currentLayout !== lastLayout) {
      lastLayout = currentLayout;
      attempts = 1;
      lastDeaths = 0;
      deadFliesVar = null; // re-discover in case vars shifted
      render();
    }

    var dfv = findDeadFliesVar(rt);
    if (!dfv || typeof dfv.data !== 'number') return;

    var current = dfv.data;
    if (current > lastDeaths) {
      attempts += (current - lastDeaths);
      lastDeaths = current;
      render();
    }
  }

  setInterval(poll, 250);
})();
</script>
</body>
</html>
